name: Build release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching package.json, for example v0.3.4
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      PRERELEASE: ${{ inputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Validate tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package version $version"
          }

      - name: Build portable
        run: npm run dist

      - name: Generate checksum
        shell: pwsh
        run: |
          $artifact = Get-ChildItem dist\NeteaseIslandLyrics-*-portable.exe -File | Select-Object -First 1
          if (-not $artifact) { throw 'Portable artifact was not created' }
          $hash = (Get-FileHash $artifact.FullName -Algorithm SHA256).Hash
          "$hash  $($artifact.Name)" | Set-Content "$($artifact.FullName).sha256" -Encoding ascii

      - name: Create or update GitHub Release
        shell: pwsh
        run: |
          $files = Get-ChildItem dist\NeteaseIslandLyrics-*-portable.exe* -File | ForEach-Object FullName
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @files --clobber
            exit $LASTEXITCODE
          }
          $arguments = @(
            'release', 'create', $env:RELEASE_TAG,
            '--title', "云岛歌词 $env:RELEASE_TAG",
            '--generate-notes'
          )
          if ($env:PRERELEASE -eq 'true') { $arguments += '--prerelease' }
          else { $arguments += '--latest' }
          $arguments += $files
          gh @arguments
