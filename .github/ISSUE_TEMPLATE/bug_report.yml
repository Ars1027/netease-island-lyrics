name: Bug 报告
description: 报告可复现的识别、歌词、窗口、启动或性能问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。媒体识别问题请先确认 Windows 媒体控制区域能够显示网易云当前歌曲。

  - type: input
    id: app-version
    attributes:
      label: 云岛版本
      placeholder: 例如 v0.3.4
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 23H2
    validations:
      required: true

  - type: input
    id: netease-version
    attributes:
      label: 网易云音乐版本
      placeholder: 客户端版本号
    validations:
      required: true

  - type: dropdown
    id: better-ncm
    attributes:
      label: BetterNCM / SMTC 状态
      options:
        - 未使用 BetterNCM，系统能看到媒体会话
        - 使用 BetterNCM，SMTC 插件已启用
        - 使用 BetterNCM，未安装或未启用 SMTC
        - 不确定
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请从启动程序开始，按顺序描述。
      placeholder: |
        1. 启动……
        2. 播放……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 截图或日志
      description: 可直接拖入图片；发布前请移除账号、路径等隐私信息。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已彻底退出旧版本，确认当前运行的是上面填写的版本。
          required: true
        - label: 我已搜索现有 Issue，没有找到相同问题。
          required: true
